<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" href="../img/icon.png" type="image/png" sizes="16x16">
    <title>Congrats! – Mini Med Quiz</title>
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="end.css">
</head>
<body>

<div class="topbar">
    <a class="nav-btn" href="./">&larr; Home</a>
    <span class="topbar-title">Mini Med Quiz</span>
</div>

<div class="container flex-center">
    <div class="badge"><span class="dot"></span> Quiz Complete</div>
    <h2>Your Score</h2>
    <div class="score-value" id="finalScore">0</div>
    <form>
        <input type="text" name="username" id="username" placeholder="Enter your name" autocomplete="off">
        <button type="submit" class="btn" id="saveScoreBtn" disabled>Save Score</button>
    </form>
    <div class="header-btns" style="margin-top:1.75rem;">
        <a class="nav-btn" href="./game.html">Play Again</a>
        <a class="nav-btn" href="./highscores.html">High Scores</a>
    </div>
</div>

<script src="end.js"></script>
</body>
</html>
